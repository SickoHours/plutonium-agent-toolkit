[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plutonium-agent-toolkit"
version = "0.1.0b1"
description = "Agent-native tools for building Plutonium T6 Zombies mods (any OS); game control is Windows-only"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SickoHours" }]
keywords = ["plutonium", "call-of-duty", "black-ops-2", "modding", "agents", "gsc", "fastfile"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SickoHours/plutonium-agent-toolkit"
Changelog = "https://github.com/SickoHours/plutonium-agent-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/SickoHours/plutonium-agent-toolkit/issues"

[project.scripts]
pat = "plutonium_agent_toolkit.cli:entry"
plutonium-agent-toolkit = "plutonium_agent_toolkit.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plutonium_agent_toolkit = ["**/*.json", "**/*.gsc", "**/*.md"]
