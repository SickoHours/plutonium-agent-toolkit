name: Release

# Publishing is a tag push. The tag must agree with the package version, the top
# CHANGELOG entry and docs/SUPPORT.md (tools/release_check.py --tag), the full
# test suite must pass on Windows, and the release notes are the CHANGELOG
# section itself. Nothing here is hand-written at release time.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Tag agrees with version, changelog and support matrix
        run: python tools/release_check.py --tag "${{ github.ref_name }}"
      - name: Unit tests
        env:
          PAT_HOME: ${{ runner.temp }}\pat-home
        run: python -m unittest discover -s tests -v
      - run: python tools/private_scan.py
      - name: Release notes exist for this version
        run: python tools/release_notes.py "${{ github.ref_name }}" > $env:RUNNER_TEMP\notes.md; Get-Content $env:RUNNER_TEMP\notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  build:
    name: Build wheel and sdist
    runs-on: windows-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Checksums
        run: Get-ChildItem dist | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Set-Content dist\SHA256SUMS.txt; Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-alpha.*|*-beta.*|*-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes/notes.md \
            --verify-tag $prerelease
